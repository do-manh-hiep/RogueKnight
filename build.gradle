buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {


  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

configure(subprojects) {
  apply plugin: 'java-library'
  java.sourceCompatibility = 21
  java.targetCompatibility = 21
  repositories {
    mavenCentral()
    maven { url 'https://s01.oss.sonatype.org' }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://jitpack.io' }
  }

  compileJava {
    options.incremental = true
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'RogueKnight'
  repositories {
    mavenCentral()
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

eclipse.project.name = 'RogueKnight' + '-parent'

def generateAssetList = tasks.register('generateAssetList') {
  def assetsFolder = layout.projectDirectory.dir('assets')
  def assetsFile = assetsFolder.file('assets.txt')

  inputs.files(fileTree(assetsFolder.asFile) {
    exclude 'assets.txt'
  })
  outputs.file(assetsFile)

  doLast {
    def paths = fileTree(assetsFolder.asFile).matching {
      exclude 'assets.txt'
    }.files.collect {
      assetsFolder.asFile.toPath().relativize(it.toPath())
        .toString().replace('\\', '/')
    }.sort()

    assetsFile.asFile.setText(
      paths.isEmpty() ? '' : paths.join('\n') + '\n',
      'UTF-8'
    )
  }
}

project(':lwjgl3') {
  tasks.named('processResources') {
    dependsOn(generateAssetList)
  }
}

// IDE generated-directory filters
allprojects {
  eclipse {
    project {
      ['.gradle', 'build', 'bin'].each { folderName ->
        resourceFilter {
          appliesTo = 'FOLDERS'
          type = 'EXCLUDE_ALL'
          recursive = true
          matcher {
            id = 'org.eclipse.ui.ide.multiFilter'
            arguments = "1.0-name-matches-false-false-${folderName}"
          }
        }
      }
    }
  }

  idea {
    module {
      excludeDirs += files('.gradle', 'build', 'bin')
    }
  }
}
